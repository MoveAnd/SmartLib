spring:
  application:
    name: snowy-xxl-job-app
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: snowy-cloud-${spring.profiles.active}
        group: ${spring.profiles.active}
        prefix: ${spring.application.name}
        file-extension: yaml
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
